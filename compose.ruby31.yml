services:
  web:
    image: enciclovida:ruby31-dev
    build:
      context: .
      dockerfile: docker/development/Dockerfile.ruby31
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace/enciclovida
      - ruby31_bundle:/usr/local/bundle
    env_file:
      - .env
    command: >
      sh -c "
        rm -f tmp/pids/server.pid &&
        exec bundle exec rails server -b 0.0.0.0 -p 3000
      "

  blurrily:
    image: enciclovida:ruby31-dev
    build:
      context: .
      dockerfile: docker/development/Dockerfile.ruby31
    volumes:
      - .:/workspace/enciclovida
      - ruby31_bundle:/usr/local/bundle

  delayed-job:
    image: enciclovida:ruby31-dev
    build:
      context: .
      dockerfile: docker/development/Dockerfile.ruby31
    volumes:
      - .:/workspace/enciclovida
      - ruby31_bundle:/usr/local/bundle

volumes:
  ruby31_bundle: